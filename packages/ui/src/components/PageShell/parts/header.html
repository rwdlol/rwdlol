<header class="main">
  <div class="container">
    <a class="logo" href="/" title="Zurück zur Startseite von Planwerk6">
      <img
        alt="Planwerk6 Logo – Startseite"
        src="/logo.svg"
        width="256"
        height="256"
      />
    </a>

    <!-- menu -->

    <button
      type="button"
      class="hamburger"
      aria-haspopup="true"
      aria-expanded="false"
      aria-controls="menu-main"
      aria-label="Hauptnavigation"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        viewBox="0 0 100 92"
        version="1.1"
      >
        <g>
          <line
            class="line first"
            x1="0"
            y1="10"
            x2="100"
            y2="10"
            shape-rendering="crispEdges"
          ></line>
          <line
            class="line cross"
            x1="0"
            y1="46"
            x2="100"
            y2="46"
            shape-rendering="crispEdges"
          ></line>
          <line
            class="line second"
            x1="0"
            y1="82"
            x2="100"
            y2="82"
            shape-rendering="crispEdges"
          ></line>
        </g>
      </svg>
    </button>
  </div>
</header>
