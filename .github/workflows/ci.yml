name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the Storybook build for GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  storybook-tests:
    name: Storybook tests (interaction + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:storybook

  build:
    name: Build
    needs: [quality, storybook-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Astro pages
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook preview
        if: ${{ !inputs.upload-pages }}
        uses: actions/upload-artifact@v6
        with:
          name: storybook-preview
          path: storybook-static
          retention-days: 7

      - name: Upload Pages artifact
        if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
