name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the Storybook build for GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  storybook-tests:
    name: Storybook tests (interaction + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:storybook

  build:
    name: Build
    needs: [quality, storybook-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build website + Storybook
        run: npm run build

      - name: Upload preview
        if: ${{ !inputs.upload-pages }}
        uses: actions/upload-artifact@v6
        with:
          name: site-preview
          path: dist
          retention-days: 7

      - name: Upload Pages artifact
        if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
